name: Build release compatibility packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Build compatibility packages for an existing release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate existing release
    runs-on: ubuntu-latest

    steps:
      - name: Verify release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euxo pipefail
          gh release view "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            >/dev/null

  build:
    name: Build ${{ matrix.name }}
    needs: validate-release
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # NVIDIA JetPack 4, e.g. Jetson Nano.
          - name: Ubuntu 18.04 ARM64
            image: ubuntu:18.04
            platform: linux/arm64
            suffix: ubuntu-18.04-arm64

          # NVIDIA JetPack 5, e.g. Xavier and early Orin releases.
          - name: Ubuntu 20.04 ARM64
            image: ubuntu:20.04
            platform: linux/arm64
            suffix: ubuntu-20.04-arm64

          # NVIDIA JetPack 6 and many current ARM64 SBC images.
          - name: Ubuntu 22.04 ARM64
            image: ubuntu:22.04
            platform: linux/arm64
            suffix: ubuntu-22.04-arm64

          # Generic newer Ubuntu ARM64 SBC installations.
          - name: Ubuntu 24.04 ARM64
            image: ubuntu:24.04
            platform: linux/arm64
            suffix: ubuntu-24.04-arm64

          # 64-bit RISC-V boards such as BeagleV-Ahead.
          - name: Debian Trixie RISC-V 64
            image: debian:trixie
            platform: linux/riscv64
            suffix: debian-trixie-riscv64

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Enable QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Build and validate compatibility packages
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release-assets

          docker run --rm \
            --platform "${PLATFORM}" \
            -e SUFFIX="${SUFFIX}" \
            -v "${PWD}:/src" \
            -w /src \
            "${IMAGE}" \
            bash -c '
              set -euxo pipefail

              export DEBIAN_FRONTEND=noninteractive

              # Ubuntu 18.04 is old enough that mirrors may move during the
              # lifetime of this workflow. Try the normal repositories first
              # and fall back to old-releases if necessary.
              if ! apt-get update; then
                if grep -q '\''VERSION_ID="18.04"'\'' /etc/os-release; then
                  sed -i \
                    -e "s|archive.ubuntu.com/ubuntu|old-releases.ubuntu.com/ubuntu|g" \
                    -e "s|security.ubuntu.com/ubuntu|old-releases.ubuntu.com/ubuntu|g" \
                    -e "s|ports.ubuntu.com/ubuntu-ports|old-releases.ubuntu.com/ubuntu|g" \
                    /etc/apt/sources.list
                  apt-get update
                else
                  exit 1
                fi
              fi

              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                cmake \
                dpkg-dev \
                libusb-1.0-0-dev \
                pkg-config

              package_version="$(dpkg-parsechangelog -S Version)"
              project_version="$(
                sed -n "s/^project(libeasymcp2221 VERSION \([0-9][0-9.]*\) LANGUAGES C)$/\1/p" CMakeLists.txt
              )"
              soname_major="${project_version%%.*}"
              package_arch="$(dpkg --print-architecture)"
              multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"

              test -n "${package_version}"
              test -n "${project_version}"
              test -n "${soname_major}"
              test -n "${package_arch}"
              test -n "${multiarch}"

              case "${package_version}" in
                "${project_version}"-*) ;;
                *)
                  echo "Debian package version ${package_version} does not match project version ${project_version}" >&2
                  exit 1
                  ;;
              esac

              # Ubuntu 18.04 ships CMake 3.10. Use the traditional
              # out-of-tree configure syntax and avoid newer -S/-B,
              # --parallel and --install command-line forms.
              mkdir -p build-sbc
              cd build-sbc

              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DCMAKE_INSTALL_LIBDIR="lib/${multiarch}" \
                -DLIBEASYMCP2221_BUILD_SHARED=ON \
                -DLIBEASYMCP2221_BUILD_STATIC=ON \
                -DLIBEASYMCP2221_BUILD_EXAMPLES=ON \
                -DLIBEASYMCP2221_BUILD_TESTS=OFF \
                -DLIBEASYMCP2221_BUILD_DOCS=OFF

              cmake --build .

              rm -rf /tmp/stage /tmp/runtime /tmp/dev
              mkdir -p /tmp/stage /tmp/runtime/DEBIAN /tmp/dev/DEBIAN

              DESTDIR=/tmp/stage \
                cmake --build . --target install

              cd /tmp/stage

              # Runtime package:
              #   - real versioned shared library
              #   - SONAME symlink
              #   - examples
              #   - man page
              find usr/lib \
                \( -type f -o -type l \) \
                -name "libeasymcp2221.so.${soname_major}*" \
                -exec cp -a --parents {} /tmp/runtime/ \;

              if [ -d usr/share/doc/libeasymcp2221/examples ]; then
                cp -a --parents \
                  usr/share/doc/libeasymcp2221/examples \
                  /tmp/runtime/
              fi

              if [ -f usr/share/man/man3/libeasymcp2221.man.3 ]; then
                cp -a --parents \
                  usr/share/man/man3/libeasymcp2221.man.3 \
                  /tmp/runtime/
              fi

              # Development package:
              #   - public headers
              #   - static library
              #   - unversioned linker symlink
              #   - pkg-config metadata
              if [ -d usr/include/libeasymcp2221 ]; then
                cp -a --parents \
                  usr/include/libeasymcp2221 \
                  /tmp/dev/
              fi

              find usr/lib \
                -type f \
                -name "libeasymcp2221.a" \
                -exec cp -a --parents {} /tmp/dev/ \;

              find usr/lib \
                -type l \
                -name "libeasymcp2221.so" \
                -exec cp -a --parents {} /tmp/dev/ \;

              find usr/lib \
                -type f \
                -path "*/pkgconfig/libeasymcp2221.pc" \
                -exec cp -a --parents {} /tmp/dev/ \;

              # Include copyright information in both binary packages.
              if [ -f /src/debian/copyright ]; then
                mkdir -p \
                  /tmp/runtime/usr/share/doc/libeasymcp2221-2 \
                  /tmp/dev/usr/share/doc/libeasymcp2221-dev

                cp /src/debian/copyright \
                  /tmp/runtime/usr/share/doc/libeasymcp2221-2/copyright

                cp /src/debian/copyright \
                  /tmp/dev/usr/share/doc/libeasymcp2221-dev/copyright
              fi

              runtime_so="$(
                find /tmp/runtime/usr/lib \
                  -type f \
                  -name "libeasymcp2221.so.${project_version}" \
                  -print \
                  -quit
              )"

              test -n "${runtime_so}"

              # Derive libc/libusb/libudev dependencies from the actual binary
              # instead of hard-coding distribution-specific package names.
              runtime_depends="$(
                cd /src
                dpkg-shlibdeps \
                  -O \
                  -e"${runtime_so}" \
                  | sed -n "s/^shlibs:Depends=//p"
              )"

              test -n "${runtime_depends}"

              # Use printf instead of shell heredocs. Unindented heredoc bodies
              # would terminate the YAML block scalar and make the workflow invalid.
              {
                printf "%s\n" \
                  "Package: libeasymcp2221-2" \
                  "Version: ${package_version}" \
                  "Architecture: ${package_arch}" \
                  "Maintainer: Tobias X. Vogel <tobias.vogel@linux.com>" \
                  "Depends: ${runtime_depends}" \
                  "Section: libs" \
                  "Priority: optional" \
                  "Homepage: https://github.com/tobiasvogel/libeasymcp2221" \
                  "Description: EasyMCP2221 C library for Microchip MCP2221 USB-I2C bridge" \
                  " This package provides the shared runtime library for MCP2221 USB-I2C adapter."
              } > /tmp/runtime/DEBIAN/control

              {
                printf "%s\n" \
                  "Package: libeasymcp2221-dev" \
                  "Version: ${package_version}" \
                  "Architecture: ${package_arch}" \
                  "Maintainer: Tobias X. Vogel <tobias.vogel@linux.com>" \
                  "Depends: libeasymcp2221-2 (= ${package_version}), libusb-1.0-0-dev" \
                  "Section: libdevel" \
                  "Priority: optional" \
                  "Homepage: https://github.com/tobiasvogel/libeasymcp2221" \
                  "Description: Development files for EasyMCP2221 C library" \
                  " This package provides headers, the static library, linker symlink," \
                  " and pkg-config metadata for libeasymcp2221."
              } > /tmp/dev/DEBIAN/control

              runtime_deb="/src/release-assets/libeasymcp2221-2_${package_version}_${SUFFIX}.deb"
              dev_deb="/src/release-assets/libeasymcp2221-dev_${package_version}_${SUFFIX}.deb"

              dpkg-deb --build /tmp/runtime "${runtime_deb}"
              dpkg-deb --build /tmp/dev "${dev_deb}"

              # 1. Validate package metadata.
              test "$(dpkg-deb -f "${runtime_deb}" Package)" = "libeasymcp2221-2"
              test "$(dpkg-deb -f "${runtime_deb}" Version)" = "${package_version}"
              test "$(dpkg-deb -f "${runtime_deb}" Architecture)" = "${package_arch}"

              test "$(dpkg-deb -f "${dev_deb}" Package)" = "libeasymcp2221-dev"
              test "$(dpkg-deb -f "${dev_deb}" Version)" = "${package_version}"
              test "$(dpkg-deb -f "${dev_deb}" Architecture)" = "${package_arch}"
              case "$(dpkg-deb -f "${dev_deb}" Depends)" in
                *libusb-1.0-0-dev*) ;;
                *)
                  echo "Development package is missing libusb-1.0-0-dev dependency" >&2
                  exit 1
                  ;;
              esac

              # 2. Validate runtime/development package separation.
              rm -rf /tmp/check-runtime /tmp/check-dev
              mkdir -p /tmp/check-runtime /tmp/check-dev
              dpkg-deb -x "${runtime_deb}" /tmp/check-runtime
              dpkg-deb -x "${dev_deb}" /tmp/check-dev

              libdir="/usr/lib/${multiarch}"

              test -f "/tmp/check-runtime${libdir}/libeasymcp2221.so.${project_version}"
              test -L "/tmp/check-runtime${libdir}/libeasymcp2221.so.${soname_major}"
              test ! -e "/tmp/check-runtime${libdir}/libeasymcp2221.so"
              test ! -e "/tmp/check-runtime${libdir}/libeasymcp2221.a"
              test ! -d "/tmp/check-runtime/usr/include/libeasymcp2221"

              test -d "/tmp/check-dev/usr/include/libeasymcp2221"
              test -f "/tmp/check-dev/usr/include/libeasymcp2221/libeasymcp2221.h"
              test -f "/tmp/check-dev${libdir}/libeasymcp2221.a"
              test -L "/tmp/check-dev${libdir}/libeasymcp2221.so"
              test -f "/tmp/check-dev${libdir}/pkgconfig/libeasymcp2221.pc"
              test ! -e "/tmp/check-dev${libdir}/libeasymcp2221.so.${project_version}"
              test -z "$(
                find /tmp/check-dev/usr/include/libeasymcp2221 \
                  -maxdepth 1 \
                  -type f \
                  -name "mcp2221_internal*.h" \
                  -print \
                  -quit
              )"

              # 3. Install both packages in the target userspace and compile,
              # link and run a real pkg-config consumer without MCP2221 hardware.
              dpkg -i "${runtime_deb}" "${dev_deb}"
              ldconfig

              test "$(pkg-config --modversion libeasymcp2221)" = "${project_version}"
              pkg-config --cflags libeasymcp2221
              pkg-config --libs libeasymcp2221
              pkg-config --static --libs libeasymcp2221

              printf "%s\n" \
                "#include <string.h>" \
                "#include <libeasymcp2221/mcp2221_errors.h>" \
                "int main(void) {" \
                "    return strcmp(mcp2221_error_code_to_string(MCP2221_ERR_OK), \"OK\") == 0 ? 0 : 1;" \
                "}" \
                > /tmp/libeasymcp2221-consumer.c

              cc -Wall -Wextra -Werror \
                /tmp/libeasymcp2221-consumer.c \
                $(pkg-config --cflags --libs libeasymcp2221) \
                -o /tmp/libeasymcp2221-consumer

              /tmp/libeasymcp2221-consumer

              printf "%s\n" \
                "#include <libeasymcp2221/mcp2221.h>" \
                "int main(void) {" \
                "    return mcp2221_open_simple(0, 0, 0, NULL, 100000, NULL) == MCP2221_ERR_INVALID ? 0 : 1;" \
                "}" \
                > /tmp/libeasymcp2221-static-consumer.c

              static_archive="$(pkg-config --variable=libdir libeasymcp2221)/libeasymcp2221.a"
              test -f "${static_archive}"
              static_libs="$(pkg-config --static --libs libeasymcp2221)"
              if [[ " ${static_libs} " != *" -leasymcp2221 "* ]]; then
                echo "pkg-config static output is missing -leasymcp2221" >&2
                exit 1
              fi
              static_libs="${static_libs/-leasymcp2221/${static_archive}}"

              cc -Wall -Wextra -Werror \
                /tmp/libeasymcp2221-static-consumer.c \
                $(pkg-config --cflags libeasymcp2221) \
                ${static_libs} \
                -o /tmp/libeasymcp2221-static-consumer

              /tmp/libeasymcp2221-static-consumer
            '

      - name: Upload compatibility package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-compat-${{ matrix.suffix }}
          path: release-assets/*.deb
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Add SBC packages to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download compatibility package artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-compat-*
          path: release-assets
          merge-multiple: true

      - name: Upload packages to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euxo pipefail

          test -n "$(find release-assets -maxdepth 1 -type f -name '*.deb' -print -quit)"

          # Remove legacy SBC asset names from v2.0.0 so the release page does
          # not expose two naming schemes after this workflow is rerun.
          for legacy in             libeasymcp2221-2_2.0.0-1_ubuntu18.04-arm64.deb             libeasymcp2221-dev_2.0.0-1_ubuntu18.04-arm64.deb             libeasymcp2221-2_2.0.0-1_ubuntu20.04-arm64.deb             libeasymcp2221-dev_2.0.0-1_ubuntu20.04-arm64.deb             libeasymcp2221-2_2.0.0-1_ubuntu22.04-arm64.deb             libeasymcp2221-dev_2.0.0-1_ubuntu22.04-arm64.deb             libeasymcp2221-2_2.0.0-1_ubuntu24.04-arm64.deb             libeasymcp2221-dev_2.0.0-1_ubuntu24.04-arm64.deb; do
            gh release delete-asset "${TAG}" "${legacy}"               --yes               --repo "${GITHUB_REPOSITORY}"               >/dev/null 2>&1 || true
          done

          gh release upload "${TAG}" \
            release-assets/*.deb \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"

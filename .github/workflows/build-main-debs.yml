name: Build main Debian snapshots

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-main-debs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Validate build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libusb-1.0-0-dev \
            doxygen \
            graphviz

      - name: Configure default build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLIBEASYMCP2221_BUILD_SHARED=ON \
            -DLIBEASYMCP2221_BUILD_STATIC=ON \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=ON \
            -DLIBEASYMCP2221_BUILD_TESTS=ON

      - name: Build default configuration
        run: cmake --build build --verbose

      - name: Run unit tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Configure documentation
        run: |
          cmake -S . -B build-docs \
            -DLIBEASYMCP2221_BUILD_DOCS=ON \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=OFF \
            -DLIBEASYMCP2221_BUILD_TESTS=OFF

      - name: Build documentation
        run: cmake --build build-docs --target docs --verbose

      - name: Configure static-only build
        run: |
          cmake -S . -B build-static \
            -DLIBEASYMCP2221_BUILD_SHARED=OFF \
            -DLIBEASYMCP2221_BUILD_STATIC=ON \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=ON \
            -DLIBEASYMCP2221_BUILD_TESTS=OFF

      - name: Build static-only configuration
        run: cmake --build build-static --verbose

  build:
    name: Build ${{ matrix.distro.name }} ${{ matrix.distro.suite }} ${{ matrix.arch.name }}
    needs: [build-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { name: debian, suite: bookworm, image: "debian:bookworm" }
          - { name: debian, suite: trixie,   image: "debian:trixie" }
          - { name: ubuntu, suite: "22.04",  image: "ubuntu:22.04" }
          - { name: ubuntu, suite: "24.04",  image: "ubuntu:24.04" }
        arch:
          - { name: amd64, platform: "linux/amd64" }
          - { name: i386,  platform: "linux/386" }
          - { name: arm64, platform: "linux/arm64" }
          - { name: armhf, platform: "linux/arm/v7" }
        exclude:
          - distro: { name: ubuntu, suite: "22.04", image: "ubuntu:22.04" }
            arch:   { name: i386, platform: "linux/386" }
          - distro: { name: ubuntu, suite: "24.04", image: "ubuntu:24.04" }
            arch:   { name: i386, platform: "linux/386" }
        include:
          - distro: { name: rpios, suite: bookworm, image: "balenalib/rpi-raspbian:bookworm" }
            arch:   { name: armv6, platform: "linux/arm/v6" }

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate snapshot version
        id: version
        shell: bash
        run: |
          project_version="$(
            sed -n 's/^project(libeasymcp2221 VERSION \([0-9][0-9.]*\) LANGUAGES C)$/\1/p' CMakeLists.txt
          )"
          test -n "${project_version}"
          build_date="$(date -u +%Y%m%d)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          snapshot_version="${project_version}+git${build_date}.${short_sha}-1"

          echo "version=${snapshot_version}" >> "$GITHUB_OUTPUT"
          echo "Building Debian snapshot ${snapshot_version}"

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - uses: docker/setup-buildx-action@v4

      - name: Build .deb in target container
        env:
          IMAGE: ${{ matrix.distro.image }}
          PLATFORM: ${{ matrix.arch.platform }}
          SNAPSHOT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euxo pipefail

          docker run --rm -t \
            --platform "${PLATFORM}" \
            -e SNAPSHOT_VERSION="${SNAPSHOT_VERSION}" \
            -v "$PWD:/src" -w /src \
            "${IMAGE}" bash -lc '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              export DEBFULLNAME="GitHub Actions"
              export DEBEMAIL="github-actions@users.noreply.github.com"

              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates \
                build-essential \
                libdistro-info-perl \
                devscripts \
                equivs \
                debhelper \
                dpkg-dev \
                fakeroot \
                ninja-build

              # Install Build-Depends from debian/control.
              mk-build-deps -i -t "apt-get -y --no-install-recommends" -r debian/control
              rm -f ./*build-deps*.deb || true

              # Replace the package version only in this temporary Actions checkout.
              # Post-release main snapshots sort after the stable 2.0.0-1 package
              # while remaining below a future 2.0.1 release.
              dch \
                -b \
                --newversion "${SNAPSHOT_VERSION}" \
                --distribution UNRELEASED \
                "Automated development snapshot from the main branch."

              echo "Updated Debian changelog:"
              head -n 8 debian/changelog

              dpkg-buildpackage -us -uc -B

              mkdir -p /src/out
              cp -v ../*.deb ../*.buildinfo ../*.changes /src/out/ || true
              chown -R --reference=/src /src/out
            '

      - name: Normalize snapshot asset names
        env:
          TARGET_SUFFIX: ${{ matrix.distro.name }}-${{ matrix.distro.suite }}-${{ matrix.arch.name }}
        shell: bash
        run: |
          set -euo pipefail

          for deb in out/*.deb; do
            test -e "${deb}" || continue
            package="$(dpkg-deb -f "${deb}" Package)"
            version="$(dpkg-deb -f "${deb}" Version)"
            mv -v "${deb}" "out/${package}_${version}_${TARGET_SUFFIX}.deb"
          done

          for metadata in out/*.buildinfo out/*.changes; do
            test -e "${metadata}" || continue
            extension="${metadata##*.}"
            stem="${metadata%.*}"
            mv -v "${metadata}" "${stem}_${TARGET_SUFFIX}.${extension}"
          done

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v6
        with:
          name: debs-main-${{ steps.version.outputs.version }}-${{ matrix.distro.name }}-${{ matrix.distro.suite }}-${{ matrix.arch.name }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  build-compat:
    name: Build compatibility snapshot ${{ matrix.name }}
    needs: [build-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 18.04 ARM64
            image: ubuntu:18.04
            platform: linux/arm64
            suffix: ubuntu-18.04-arm64
          - name: Ubuntu 20.04 ARM64
            image: ubuntu:20.04
            platform: linux/arm64
            suffix: ubuntu-20.04-arm64
          - name: Debian Trixie RISC-V 64
            image: debian:trixie
            platform: linux/riscv64
            suffix: debian-trixie-riscv64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate snapshot version
        id: version
        shell: bash
        run: |
          project_version="$(
            sed -n 's/^project(libeasymcp2221 VERSION \([0-9][0-9.]*\) LANGUAGES C)$/\1/p' CMakeLists.txt
          )"
          test -n "${project_version}"
          build_date="$(date -u +%Y%m%d)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          snapshot_version="${project_version}+git${build_date}.${short_sha}-1"

          echo "version=${snapshot_version}" >> "$GITHUB_OUTPUT"

      - name: Enable QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Build and validate compatibility snapshot packages
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
          SNAPSHOT_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out-compat

          docker run --rm \
            --platform "${PLATFORM}" \
            -e SUFFIX="${SUFFIX}" \
            -e SNAPSHOT_VERSION="${SNAPSHOT_VERSION}" \
            -v "${PWD}:/src" \
            -w /src \
            "${IMAGE}" \
            bash -c '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive

              if ! apt-get update; then
                if grep -q '\''VERSION_ID="18.04"'\'' /etc/os-release; then
                  sed -i \
                    -e "s|archive.ubuntu.com/ubuntu|old-releases.ubuntu.com/ubuntu|g" \
                    -e "s|security.ubuntu.com/ubuntu|old-releases.ubuntu.com/ubuntu|g" \
                    -e "s|ports.ubuntu.com/ubuntu-ports|old-releases.ubuntu.com/ubuntu|g" \
                    /etc/apt/sources.list
                  apt-get update
                else
                  exit 1
                fi
              fi

              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                cmake \
                dpkg-dev \
                libusb-1.0-0-dev \
                pkg-config

              project_version="$(
                sed -n "s/^project(libeasymcp2221 VERSION \([0-9][0-9.]*\) LANGUAGES C)$/\1/p" CMakeLists.txt
              )"
              soname_major="${project_version%%.*}"
              package_arch="$(dpkg --print-architecture)"
              multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"

              test -n "${project_version}"
              test -n "${soname_major}"
              test -n "${package_arch}"
              test -n "${multiarch}"
              test -n "${SNAPSHOT_VERSION}"

              mkdir -p build-compat
              cd build-compat
              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DCMAKE_INSTALL_LIBDIR="lib/${multiarch}" \
                -DLIBEASYMCP2221_BUILD_SHARED=ON \
                -DLIBEASYMCP2221_BUILD_STATIC=ON \
                -DLIBEASYMCP2221_BUILD_EXAMPLES=ON \
                -DLIBEASYMCP2221_BUILD_TESTS=OFF \
                -DLIBEASYMCP2221_BUILD_DOCS=OFF
              cmake --build .

              rm -rf /tmp/stage /tmp/runtime /tmp/dev
              mkdir -p /tmp/stage /tmp/runtime/DEBIAN /tmp/dev/DEBIAN
              DESTDIR=/tmp/stage cmake --build . --target install
              cd /tmp/stage

              find usr/lib \
                \( -type f -o -type l \) \
                -name "libeasymcp2221.so.${soname_major}*" \
                -exec cp -a --parents {} /tmp/runtime/ \;

              cp -a --parents usr/include/libeasymcp2221 /tmp/dev/
              find usr/lib -type f -name "libeasymcp2221.a" \
                -exec cp -a --parents {} /tmp/dev/ \;
              find usr/lib -type l -name "libeasymcp2221.so" \
                -exec cp -a --parents {} /tmp/dev/ \;
              find usr/lib -type f -path "*/pkgconfig/libeasymcp2221.pc" \
                -exec cp -a --parents {} /tmp/dev/ \;

              runtime_so="$(
                find /tmp/runtime/usr/lib \
                  -type f \
                  -name "libeasymcp2221.so.${project_version}" \
                  -print \
                  -quit
              )"
              test -n "${runtime_so}"

              runtime_depends="$(
                cd /src
                dpkg-shlibdeps -O -e"${runtime_so}" \
                  | sed -n "s/^shlibs:Depends=//p"
              )"
              test -n "${runtime_depends}"

              {
                printf "%s\n" \
                  "Package: libeasymcp2221-2" \
                  "Version: ${SNAPSHOT_VERSION}" \
                  "Architecture: ${package_arch}" \
                  "Maintainer: Tobias X. Vogel <tobias.vogel@linux.com>" \
                  "Depends: ${runtime_depends}" \
                  "Section: libs" \
                  "Priority: optional" \
                  "Homepage: https://github.com/tobiasvogel/libeasymcp2221" \
                  "Description: EasyMCP2221 C library for Microchip MCP2221 USB-I2C bridge" \
                  " This package provides the shared runtime library for MCP2221 USB-I2C adapter."
              } > /tmp/runtime/DEBIAN/control

              {
                printf "%s\n" \
                  "Package: libeasymcp2221-dev" \
                  "Version: ${SNAPSHOT_VERSION}" \
                  "Architecture: ${package_arch}" \
                  "Maintainer: Tobias X. Vogel <tobias.vogel@linux.com>" \
                  "Depends: libeasymcp2221-2 (= ${SNAPSHOT_VERSION}), libusb-1.0-0-dev" \
                  "Section: libdevel" \
                  "Priority: optional" \
                  "Homepage: https://github.com/tobiasvogel/libeasymcp2221" \
                  "Description: Development files for EasyMCP2221 C library" \
                  " This package provides headers, the static library, linker symlink," \
                  " and pkg-config metadata for libeasymcp2221."
              } > /tmp/dev/DEBIAN/control

              runtime_deb="/src/out-compat/libeasymcp2221-2_${SNAPSHOT_VERSION}_${SUFFIX}.deb"
              dev_deb="/src/out-compat/libeasymcp2221-dev_${SNAPSHOT_VERSION}_${SUFFIX}.deb"

              dpkg-deb --build /tmp/runtime "${runtime_deb}"
              dpkg-deb --build /tmp/dev "${dev_deb}"

              dpkg -i "${runtime_deb}" "${dev_deb}"
              ldconfig

              test "$(pkg-config --modversion libeasymcp2221)" = "${project_version}"
              pkg-config --cflags libeasymcp2221
              pkg-config --libs libeasymcp2221
              pkg-config --static --libs libeasymcp2221

              printf "%s\n" \
                "#include <libeasymcp2221/mcp2221.h>" \
                "int main(void) {" \
                "    return mcp2221_open_simple(0, 0, 0, NULL, 100000, NULL) == MCP2221_ERR_INVALID ? 0 : 1;" \
                "}" \
                > /tmp/libeasymcp2221-static-consumer.c

              static_archive="$(pkg-config --variable=libdir libeasymcp2221)/libeasymcp2221.a"
              test -f "${static_archive}"
              static_libs="$(pkg-config --static --libs libeasymcp2221)"
              if [[ " ${static_libs} " != *" -leasymcp2221 "* ]]; then
                echo "pkg-config static output is missing -leasymcp2221" >&2
                exit 1
              fi
              static_libs="${static_libs/-leasymcp2221/${static_archive}}"

              cc -Wall -Wextra -Werror \
                /tmp/libeasymcp2221-static-consumer.c \
                $(pkg-config --cflags libeasymcp2221) \
                ${static_libs} \
                -o /tmp/libeasymcp2221-static-consumer

              /tmp/libeasymcp2221-static-consumer
            '

      - name: Upload compatibility snapshot artifacts
        uses: actions/upload-artifact@v6
        with:
          name: debs-main-${{ steps.version.outputs.version }}-${{ matrix.suffix }}
          path: out-compat/*.deb
          if-no-files-found: error
          retention-days: 30


  build-indep:
    name: Build Debian bookworm architecture-independent packages
    needs: [build-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate snapshot version
        id: version
        shell: bash
        run: |
          project_version="$(
            sed -n 's/^project(libeasymcp2221 VERSION \([0-9][0-9.]*\) LANGUAGES C)$/\1/p' CMakeLists.txt
          )"
          test -n "${project_version}"
          build_date="$(date -u +%Y%m%d)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          snapshot_version="${project_version}+git${build_date}.${short_sha}-1"

          echo "version=${snapshot_version}" >> "$GITHUB_OUTPUT"
          echo "Building architecture-independent Debian snapshot ${snapshot_version}"

      - name: Build architecture-independent .deb
        env:
          SNAPSHOT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euxo pipefail

          docker run --rm -t \
            --platform linux/amd64 \
            -e SNAPSHOT_VERSION="${SNAPSHOT_VERSION}" \
            -v "$PWD:/src" -w /src \
            debian:bookworm bash -lc '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              export DEBFULLNAME="GitHub Actions"
              export DEBEMAIL="github-actions@users.noreply.github.com"

              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates \
                build-essential \
                libdistro-info-perl \
                devscripts \
                equivs \
                debhelper \
                dpkg-dev \
                fakeroot \
                ninja-build

              mk-build-deps -i -t "apt-get -y --no-install-recommends" -r debian/control
              rm -f ./*build-deps*.deb || true

              dch \
                -b \
                --newversion "${SNAPSHOT_VERSION}" \
                --distribution UNRELEASED \
                "Automated development snapshot from the main branch."

              echo "Updated Debian changelog:"
              head -n 8 debian/changelog

              dpkg-buildpackage -us -uc -A

              mkdir -p /src/out-indep
              cp -v ../*.deb ../*.buildinfo ../*.changes /src/out-indep/ || true
            '

      - name: Verify documentation package contents
        run: |
          set -euxo pipefail
          doc_deb="$(find out-indep -maxdepth 1 -type f -name 'libeasymcp2221-doc_*_all.deb' -print -quit)"
          test -n "${doc_deb}"

          doc_root="$(mktemp -d)"
          trap 'rm -rf "${doc_root}"' EXIT
          dpkg-deb -x "${doc_deb}" "${doc_root}"

          test -f "${doc_root}/usr/share/doc/libeasymcp2221-doc/html/index.html"
          if test -d "${doc_root}/usr/share/doc/libeasymcp2221-dev"; then
            echo "Unexpected libeasymcp2221-dev documentation directory in doc package" >&2
            exit 1
          fi

      - name: Upload architecture-independent snapshot artifacts
        uses: actions/upload-artifact@v6
        with:
          name: debs-main-${{ steps.version.outputs.version }}-debian-bookworm-all
          path: out-indep/
          if-no-files-found: error
          retention-days: 30

  publish-snapshot:
    name: Publish latest main snapshot
    needs: [build, build-compat, build-indep]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Debian package artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: debs-main-*
          path: release-assets
          merge-multiple: true

      - name: Determine snapshot version
        id: version
        shell: bash
        run: |
          project_version="$(
            sed -n 's/^project(libeasymcp2221 VERSION \([0-9][0-9.]*\) LANGUAGES C)$/\1/p' CMakeLists.txt
          )"
          test -n "${project_version}"
          build_date="$(date -u +%Y%m%d)"
          short_sha="${GITHUB_SHA::8}"
          snapshot_version="${project_version}+git${build_date}.${short_sha}-1"

          echo "version=${snapshot_version}" >> "$GITHUB_OUTPUT"
          echo "Publishing Debian snapshot ${snapshot_version}"

      - name: Prepare snapshot release assets
        env:
          SNAPSHOT_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf snapshot-bundles snapshot-release-assets
          mkdir -p snapshot-bundles snapshot-release-assets

          doc_deb=""

          for deb in release-assets/*.deb; do
            test -e "${deb}" || continue
            filename="${deb##*/}"

            if [[ "${filename}" == "libeasymcp2221-doc_${SNAPSHOT_VERSION}_all.deb" ]]; then
              doc_deb="${deb}"
              continue
            fi

            case "${filename}" in
              *-dbgsym_"${SNAPSHOT_VERSION}"_*.deb)
                continue
                ;;
              *_"${SNAPSHOT_VERSION}"_*.deb)
                suffix="${filename#*_${SNAPSHOT_VERSION}_}"
                suffix="${suffix%.deb}"
                mkdir -p "snapshot-bundles/${suffix}"
                cp -v "${deb}" "snapshot-bundles/${suffix}/"
                ;;
            esac
          done

          test -n "${doc_deb}"
          cp -v "${doc_deb}" snapshot-release-assets/

          bundle_count=0
          for bundle_dir in snapshot-bundles/*; do
            test -d "${bundle_dir}" || continue
            suffix="${bundle_dir##*/}"
            tar -czf \
              "snapshot-release-assets/libeasymcp2221-snapshot_${suffix}.tar.gz" \
              -C "${bundle_dir}" .
            bundle_count=$((bundle_count + 1))
          done

          test "${bundle_count}" -gt 0
          ls -lh snapshot-release-assets/

      - name: Replace rolling snapshot prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euxo pipefail

          tag="v2-snapshot"

          # Recreate the rolling prerelease so that its tag points to the
          # current main commit and no assets from older snapshots remain.
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release delete "${tag}" --cleanup-tag --yes
          fi

          cat > release-notes.md <<EOF
          Automated development snapshot from the `main` branch.

          Debian package version: \`${SNAPSHOT_VERSION}\`
          Commit: \`${GITHUB_SHA}\`

          These packages are development snapshots and are not stable releases.
          EOF

          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "v2 development snapshot (${SNAPSHOT_VERSION})" \
            --notes-file release-notes.md \
            --prerelease

          shopt -s nullglob
          assets=(snapshot-release-assets/*)
          test "${#assets[@]}" -gt 0
          gh release upload "${tag}" "${assets[@]}"


name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake \
            pkg-config \
            libusb-1.0-0-dev

      - name: Configure
        run: |
          cmake -S . -B build-tests \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLIBEASYMCP2221_BUILD_TESTS=ON \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-tests --parallel

      - name: Run unit tests
        working-directory: build-tests
        run: ctest --output-on-failure

  windows-linkage:
    name: Windows shared/static linkage
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MinGW environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libusb

      - name: Verify Windows export macros
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          printf '#include "mcp2221_export.h"\n' \
            | gcc -E -dD -Iinclude -x c - \
            | grep -F '#define MCP2221_API __declspec(dllimport)'

          printf '#include "mcp2221_export.h"\n' \
            | gcc -E -dD -DLIBEASYMCP2221_STATIC -Iinclude -x c - \
            | grep -E '^#define MCP2221_API[[:space:]]*$'

      - name: Configure shared build
        shell: msys2 {0}
        run: |
          cmake -S . -B build-win-shared -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBEASYMCP2221_BUILD_SHARED=ON \
            -DLIBEASYMCP2221_BUILD_STATIC=OFF \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=ON \
            -DLIBEASYMCP2221_BUILD_TESTS=OFF

      - name: Build shared library and consumers
        shell: msys2 {0}
        run: cmake --build build-win-shared --verbose

      - name: Configure static build
        shell: msys2 {0}
        run: |
          cmake -S . -B build-win-static -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBEASYMCP2221_BUILD_SHARED=OFF \
            -DLIBEASYMCP2221_BUILD_STATIC=ON \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=ON \
            -DLIBEASYMCP2221_BUILD_TESTS=OFF

      - name: Build static library and consumers
        shell: msys2 {0}
        run: cmake --build build-win-static --verbose

      - name: Configure fake-libusb regression test
        shell: msys2 {0}
        run: |
          cmake -S . -B build-win-fake-test -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLIBEASYMCP2221_BUILD_SHARED=OFF \
            -DLIBEASYMCP2221_BUILD_STATIC=ON \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=OFF \
            -DLIBEASYMCP2221_BUILD_TESTS=ON

      - name: Build and run fake-libusb regression test
        shell: msys2 {0}
        run: |
          cmake --build build-win-fake-test --target test_fake_libusb --verbose
          cd build-win-fake-test
          ctest --output-on-failure -R '^test_fake_libusb$'

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake \
            pkg-config \
            libusb-1.0-0-dev

      - name: Configure
        run: |
          cmake -S . -B build-tests \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLIBEASYMCP2221_BUILD_TESTS=ON \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-tests --parallel

      - name: Run unit tests
        working-directory: build-tests
        run: ctest --output-on-failure

  windows-linkage:
    name: Windows shared/static linkage
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MinGW environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libusb

      - name: Verify Windows export macros
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          printf '#include "mcp2221_export.h"\n' \
            | gcc -E -dD -Iinclude -x c - \
            | grep -F '#define MCP2221_API __declspec(dllimport)'

          printf '#include "mcp2221_export.h"\n' \
            | gcc -E -dD -DLIBEASYMCP2221_STATIC -Iinclude -x c - \
            | grep -E '^#define MCP2221_API[[:space:]]*$'

      - name: Configure shared build
        shell: msys2 {0}
        run: |
          cmake -S . -B build-win-shared -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBEASYMCP2221_BUILD_SHARED=ON \
            -DLIBEASYMCP2221_BUILD_STATIC=OFF \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=ON \
            -DLIBEASYMCP2221_BUILD_TESTS=OFF

      - name: Build shared library and consumers
        shell: msys2 {0}
        run: cmake --build build-win-shared --verbose

      - name: Configure static build
        shell: msys2 {0}
        run: |
          cmake -S . -B build-win-static -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBEASYMCP2221_BUILD_SHARED=OFF \
            -DLIBEASYMCP2221_BUILD_STATIC=ON \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=ON \
            -DLIBEASYMCP2221_BUILD_TESTS=OFF

      - name: Build static library and consumers
        shell: msys2 {0}
        run: cmake --build build-win-static --verbose

      - name: Configure fake-libusb regression test
        shell: msys2 {0}
        run: |
          cmake -S . -B build-win-fake-test -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLIBEASYMCP2221_BUILD_SHARED=OFF \
            -DLIBEASYMCP2221_BUILD_STATIC=ON \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=OFF \
            -DLIBEASYMCP2221_BUILD_TESTS=ON

      - name: Build and run fake-libusb regression test
        shell: msys2 {0}
        run: |
          cmake --build build-win-fake-test --target test_fake_libusb --verbose
          cd build-win-fake-test
          ctest --output-on-failure -R '^test_fake_libusb$'

  windows-msvc:
    name: Windows native MSVC
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native libusb with vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libusb:x64-windows

      - name: Configure native MSVC build
        shell: pwsh
        run: |
          cmake -S . -B build-msvc -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DLIBEASYMCP2221_BUILD_SHARED=ON `
            -DLIBEASYMCP2221_BUILD_STATIC=ON `
            -DLIBEASYMCP2221_BUILD_EXAMPLES=ON `
            -DLIBEASYMCP2221_BUILD_TESTS=OFF

      - name: Build and install native MSVC libraries
        shell: pwsh
        run: |
          cmake --build build-msvc --config Release --parallel
          cmake --install build-msvc --config Release `
            --prefix "$env:GITHUB_WORKSPACE\install-msvc"

      - name: Verify native MSVC artifact names
        shell: pwsh
        run: |
          $required = @(
            "$env:GITHUB_WORKSPACE\install-msvc\bin\libeasymcp2221.dll",
            "$env:GITHUB_WORKSPACE\install-msvc\lib\libeasymcp2221.lib",
            "$env:GITHUB_WORKSPACE\install-msvc\lib\libeasymcp2221_static.lib"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing expected MSVC artifact: $path"
            }
          }

      - name: Link external shared and static MSVC consumers
        shell: pwsh
        run: |
          cmake -S tests/msvc_consumer -B build-msvc-consumer -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            "-DLIBEASYMCP2221_INSTALL_DIR=$env:GITHUB_WORKSPACE\install-msvc"
          cmake --build build-msvc-consumer --config Release --parallel

      - name: Configure MSVC fake-libusb regression test
        shell: pwsh
        run: |
          cmake -S . -B build-msvc-fake -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DLIBEASYMCP2221_BUILD_SHARED=OFF `
            -DLIBEASYMCP2221_BUILD_STATIC=ON `
            -DLIBEASYMCP2221_BUILD_EXAMPLES=OFF `
            -DLIBEASYMCP2221_BUILD_TESTS=ON

      - name: Build and run MSVC fake-libusb regression test
        shell: pwsh
        run: |
          cmake --build build-msvc-fake --config Debug `
            --target test_fake_libusb --parallel
          ctest --test-dir build-msvc-fake -C Debug `
            --output-on-failure -R '^test_fake_libusb$'

  abi-compatibility:
    name: ABI compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out current source
        uses: actions/checkout@v4
        with:
          path: current
          fetch-depth: 0

      - name: Check out ABI baseline
        uses: actions/checkout@v4
        with:
          ref: v2.0.0
          path: baseline

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            abi-compliance-checker \
            abi-dumper \
            build-essential \
            cmake \
            libusb-1.0-0-dev \
            pkg-config

      - name: Configure ABI baseline
        run: |
          cmake -S baseline -B build-baseline \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLIBEASYMCP2221_BUILD_SHARED=ON \
            -DLIBEASYMCP2221_BUILD_STATIC=OFF \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=OFF \
            -DLIBEASYMCP2221_BUILD_TESTS=OFF

      - name: Build and install ABI baseline
        run: |
          cmake --build build-baseline --parallel
          cmake --install build-baseline \
            --prefix "${GITHUB_WORKSPACE}/install-baseline"

      - name: Configure current version
        run: |
          cmake -S current -B build-current \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLIBEASYMCP2221_BUILD_SHARED=ON \
            -DLIBEASYMCP2221_BUILD_STATIC=OFF \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=OFF \
            -DLIBEASYMCP2221_BUILD_TESTS=OFF

      - name: Build and install current version
        run: |
          cmake --build build-current --parallel
          cmake --install build-current \
            --prefix "${GITHUB_WORKSPACE}/install-current"

      - name: Locate installed shared libraries
        id: libraries
        shell: bash
        run: |
          set -euo pipefail

          baseline_library="$(
            find "${GITHUB_WORKSPACE}/install-baseline" \
              -type f \
              -name 'libeasymcp2221.so.*' \
              -print \
              -quit
          )"

          current_library="$(
            find "${GITHUB_WORKSPACE}/install-current" \
              -type f \
              -name 'libeasymcp2221.so.*' \
              -print \
              -quit
          )"

          test -n "${baseline_library}"
          test -n "${current_library}"

          echo "baseline=${baseline_library}" >> "${GITHUB_OUTPUT}"
          echo "current=${current_library}" >> "${GITHUB_OUTPUT}"

      - name: Create ABI dumps
        run: |
          abi-dumper \
            "${{ steps.libraries.outputs.baseline }}" \
            -o abi-baseline.dump \
            -lver 2.0.0 \
            -public-headers \
            "${GITHUB_WORKSPACE}/install-baseline/include/libeasymcp2221"

          abi-dumper \
            "${{ steps.libraries.outputs.current }}" \
            -o abi-current.dump \
            -lver current \
            -public-headers \
            "${GITHUB_WORKSPACE}/install-current/include/libeasymcp2221"

      - name: Check ABI compatibility
        id: abi-check
        run: |
          abi-compliance-checker \
            -l easymcp2221 \
            -old abi-baseline.dump \
            -new abi-current.dump

      - name: Lock main after ABI failure
        if: ${{ always() && github.event_name == 'push' && steps.abi-check.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.RULESET_TOKEN }}
          RULESET_ID: 21249672
        run: |
          curl --fail-with-body --silent --show-error -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/rulesets/${RULESET_ID}" \
            -d '{"enforcement":"active"}'

      - name: Unlock main after successful ABI check
        if: ${{ always() && github.event_name == 'push' && steps.abi-check.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.RULESET_TOKEN }}
          RULESET_ID: 21249672
        run: |
          curl --fail-with-body --silent --show-error -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/rulesets/${RULESET_ID}" \
            -d '{"enforcement":"disabled"}'

      - name: Upload ABI compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abi-compatibility-report
          path: compat_reports/
          if-no-files-found: ignore
          retention-days: 14

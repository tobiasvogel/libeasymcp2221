name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  legacy-api:
    name: Prevent new legacy API uses
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select comparison base
        id: base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify "${{ github.event.before }}^{commit}" >/dev/null 2>&1; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Check added lines for legacy API names
        run: ./scripts/check-no-new-legacy-api.sh "${{ steps.base.outputs.ref }}"

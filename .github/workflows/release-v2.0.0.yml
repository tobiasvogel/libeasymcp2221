name: Release v2

on:
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      project_version: ${{ steps.version.outputs.project_version }}
      debian_version: ${{ steps.version.outputs.debian_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate version metadata
        id: version
        shell: bash
        run: |
          set -euxo pipefail
          project_version="$(
            sed -n 's/^project(libeasymcp2221 VERSION \([0-9][0-9.]*\) LANGUAGES C)$/\1/p' CMakeLists.txt
          )"
          debian_version="$(dpkg-parsechangelog -S Version)"
          release_tag="v${project_version}"

          test -n "${project_version}"
          test -n "${debian_version}"
          case "${debian_version}" in
            "${project_version}"-*) ;;
            *) exit 1 ;;
          esac

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            test "${GITHUB_REF_NAME}" = "${release_tag}"
          fi

          echo "project_version=${project_version}" >> "${GITHUB_OUTPUT}"
          echo "debian_version=${debian_version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

  build-test:
    name: Validate build and tests
    needs: [validate-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libusb-1.0-0-dev doxygen graphviz
      - name: Configure default build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBEASYMCP2221_BUILD_SHARED=ON \
            -DLIBEASYMCP2221_BUILD_STATIC=ON \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=ON \
            -DLIBEASYMCP2221_BUILD_TESTS=ON
      - name: Build default configuration
        run: cmake --build build --verbose
      - name: Run unit tests
        working-directory: build
        run: ctest --output-on-failure
      - name: Configure documentation
        run: |
          cmake -S . -B build-docs \
            -DLIBEASYMCP2221_BUILD_DOCS=ON \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=OFF \
            -DLIBEASYMCP2221_BUILD_TESTS=OFF
      - name: Build documentation
        run: cmake --build build-docs --target docs --verbose
      - name: Configure static-only build
        run: |
          cmake -S . -B build-static \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBEASYMCP2221_BUILD_SHARED=OFF \
            -DLIBEASYMCP2221_BUILD_STATIC=ON \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=ON \
            -DLIBEASYMCP2221_BUILD_TESTS=OFF
      - name: Build static-only configuration
        run: cmake --build build-static --verbose

  build-arch:
    name: Build ${{ matrix.distro.name }} ${{ matrix.distro.suite }} ${{ matrix.arch.name }}
    needs: [validate-tag, build-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { name: debian, suite: bookworm, image: "debian:bookworm" }
          - { name: debian, suite: trixie, image: "debian:trixie" }
          - { name: ubuntu, suite: "22.04", image: "ubuntu:22.04" }
          - { name: ubuntu, suite: "24.04", image: "ubuntu:24.04" }
        arch:
          - { name: amd64, platform: "linux/amd64" }
          - { name: i386, platform: "linux/386" }
          - { name: arm64, platform: "linux/arm64" }
          - { name: armhf, platform: "linux/arm/v7" }
        exclude:
          - distro: { name: ubuntu, suite: "22.04", image: "ubuntu:22.04" }
            arch: { name: i386, platform: "linux/386" }
          - distro: { name: ubuntu, suite: "24.04", image: "ubuntu:24.04" }
            arch: { name: i386, platform: "linux/386" }
        include:
          - distro: { name: rpios, suite: bookworm, image: "balenalib/rpi-raspbian:bookworm" }
            arch: { name: armv6, platform: "linux/arm/v6" }

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: all
      - uses: docker/setup-buildx-action@v4
      - name: Build architecture-dependent packages
        env:
          IMAGE: ${{ matrix.distro.image }}
          PLATFORM: ${{ matrix.arch.platform }}
          DEBIAN_VERSION: ${{ needs.validate-tag.outputs.debian_version }}
        run: |
          set -euxo pipefail
          docker run --rm -t \
            --platform "${PLATFORM}" \
            -e DEBIAN_VERSION="${DEBIAN_VERSION}" \
            -v "$PWD:/src" -w /src \
            "${IMAGE}" bash -lc '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates build-essential devscripts equivs debhelper dpkg-dev \
                fakeroot cmake pkg-config ninja-build libusb-1.0-0-dev
              mk-build-deps -i -t "apt-get -y --no-install-recommends" -r debian/control
              rm -f ./*build-deps*.deb || true
              test "$(dpkg-parsechangelog -S Version)" = "${DEBIAN_VERSION}"
              dpkg-buildpackage -us -uc -B
              mkdir -p /src/out
              cp -v ../*.deb ../*.buildinfo ../*.changes /src/out/ || true
            '
      - name: Upload canonical release packages
        if: >-
          (matrix.distro.name == 'debian' && matrix.distro.suite == 'bookworm') ||
          matrix.distro.name == 'rpios'
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ needs.validate-tag.outputs.project_version }}-${{ matrix.arch.name }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  build-indep:
    name: Build architecture-independent documentation package
    needs: [validate-tag, build-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build architecture-independent package
        env:
          DEBIAN_VERSION: ${{ needs.validate-tag.outputs.debian_version }}
        run: |
          set -euxo pipefail
          docker run --rm -t \
            --platform linux/amd64 \
            -e DEBIAN_VERSION="${DEBIAN_VERSION}" \
            -v "$PWD:/src" -w /src \
            debian:bookworm bash -lc '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates build-essential devscripts equivs debhelper dpkg-dev \
                fakeroot cmake pkg-config ninja-build libusb-1.0-0-dev
              mk-build-deps -i -t "apt-get -y --no-install-recommends" -r debian/control
              rm -f ./*build-deps*.deb || true
              test "$(dpkg-parsechangelog -S Version)" = "${DEBIAN_VERSION}"
              dpkg-buildpackage -us -uc -A
              mkdir -p /src/out-indep
              cp -v ../*.deb ../*.buildinfo ../*.changes /src/out-indep/ || true
            '
      - name: Verify documentation package contents
        env:
          DEBIAN_VERSION: ${{ needs.validate-tag.outputs.debian_version }}
        run: |
          set -euxo pipefail
          doc_deb="$(find out-indep -maxdepth 1 -type f -name "libeasymcp2221-doc_${DEBIAN_VERSION}_all.deb" -print -quit)"
          test -n "${doc_deb}"
          doc_root="$(mktemp -d)"
          trap 'rm -rf "${doc_root}"' EXIT
          dpkg-deb -x "${doc_deb}" "${doc_root}"
          test -f "${doc_root}/usr/share/doc/libeasymcp2221-doc/html/index.html"
          test ! -d "${doc_root}/usr/share/doc/libeasymcp2221-dev"
      - name: Upload documentation package
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ needs.validate-tag.outputs.project_version }}-all
          path: out-indep/
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish release
    needs: [validate-tag, build-arch, build-indep]
    if: github.event_name == 'push' && github.ref_name == needs.validate-tag.outputs.release_tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download canonical release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-${{ needs.validate-tag.outputs.project_version }}-*
          path: release-artifacts
      - name: Prepare release assets
        env:
          PROJECT_VERSION: ${{ needs.validate-tag.outputs.project_version }}
          DEBIAN_VERSION: ${{ needs.validate-tag.outputs.debian_version }}
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release-assets

          # Canonical Debian Bookworm packages. Keep the internal Debian
          # Architecture metadata unchanged, but make the GitHub asset names
          # explicit about the distribution/userspace they were built for.
          for arch in amd64 i386 arm64 armhf; do
            cp -v \
              "release-artifacts/release-${PROJECT_VERSION}-${arch}/libeasymcp2221-2_${DEBIAN_VERSION}_${arch}.deb" \
              "release-assets/libeasymcp2221-2_${DEBIAN_VERSION}_debian-bookworm-${arch}.deb"
            cp -v \
              "release-artifacts/release-${PROJECT_VERSION}-${arch}/libeasymcp2221-dev_${DEBIAN_VERSION}_${arch}.deb" \
              "release-assets/libeasymcp2221-dev_${DEBIAN_VERSION}_debian-bookworm-${arch}.deb"
          done

          # Architecture-independent documentation package.
          cp -v "release-artifacts/release-${PROJECT_VERSION}-all/"*.deb release-assets/

          # Raspberry Pi OS ARMv6 uses Debian's armhf package architecture,
          # so rename the outer asset filenames to avoid colliding with the
          # normal Debian Bookworm armhf packages. Package metadata remains armhf.
          cp -v \
            "release-artifacts/release-${PROJECT_VERSION}-armv6/libeasymcp2221-2_${DEBIAN_VERSION}_armhf.deb" \
            "release-assets/libeasymcp2221-2_${DEBIAN_VERSION}_rpios-bookworm-armv6.deb"
          cp -v \
            "release-artifacts/release-${PROJECT_VERSION}-armv6/libeasymcp2221-dev_${DEBIAN_VERSION}_armhf.deb" \
            "release-assets/libeasymcp2221-dev_${DEBIAN_VERSION}_rpios-bookworm-armv6.deb"

      - name: Verify release assets
        env:
          DEBIAN_VERSION: ${{ needs.validate-tag.outputs.debian_version }}
        shell: bash
        run: |
          set -euxo pipefail
          test -f "release-assets/libeasymcp2221-doc_${DEBIAN_VERSION}_all.deb"
          for arch in amd64 i386 arm64 armhf; do
            test -f "release-assets/libeasymcp2221-2_${DEBIAN_VERSION}_debian-bookworm-${arch}.deb"
            test -f "release-assets/libeasymcp2221-dev_${DEBIAN_VERSION}_debian-bookworm-${arch}.deb"
          done
          test -f "release-assets/libeasymcp2221-2_${DEBIAN_VERSION}_rpios-bookworm-armv6.deb"
          test -f "release-assets/libeasymcp2221-dev_${DEBIAN_VERSION}_rpios-bookworm-armv6.deb"
      - name: Create final GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_VERSION: ${{ needs.validate-tag.outputs.project_version }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.release_tag }}
        shell: bash
        run: |
          set -euxo pipefail
          test "${GITHUB_REF_NAME}" = "${RELEASE_TAG}"
          cat > release-notes.md <<EOF
          libeasymcp2221 ${PROJECT_VERSION}

          This release introduces the incompatible 2.0 API, removes deprecated
          1.x compatibility APIs, finalizes explicit error-code and ownership
          contracts, hardens MCP2221 protocol behavior, and includes generated
          Doxygen API documentation.

          See MIGRATION.md for guidance when updating 1.x applications.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "libeasymcp2221 ${PROJECT_VERSION}" \
            --notes-file release-notes.md
          find release-assets -maxdepth 1 -type f -name '*.deb' -print0 \
            | xargs -0 -r gh release upload "${GITHUB_REF_NAME}"

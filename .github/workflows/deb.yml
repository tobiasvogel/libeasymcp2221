name: build-debs

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to build and publish, e.g. v1.1.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v') == false
        run: |
          echo "release_tag must start with v, for example v1.1.1"
          exit 1

      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v5

      - name: Checkout manual release tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libusb-1.0-0-dev

      - name: Configure default build
        run: |
          cmake -S . -B build \
            -DLIBEASYMCP2221_BUILD_SHARED=ON \
            -DLIBEASYMCP2221_BUILD_STATIC=ON \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=ON

      - name: Build default configuration
        run: cmake --build build --verbose

      - name: Run tests if present
        run: ctest --test-dir build --output-on-failure

      - name: Configure static-only build
        run: |
          cmake -S . -B build-static \
            -DLIBEASYMCP2221_BUILD_SHARED=OFF \
            -DLIBEASYMCP2221_BUILD_STATIC=ON \
            -DLIBEASYMCP2221_BUILD_EXAMPLES=ON

      - name: Build static-only configuration
        run: cmake --build build-static --verbose

  build:
    needs: [build-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { name: debian, suite: bookworm, image: "debian:bookworm" }
          - { name: debian, suite: trixie,   image: "debian:trixie" }
          - { name: ubuntu, suite: "22.04",  image: "ubuntu:22.04" }
          - { name: ubuntu, suite: "24.04",  image: "ubuntu:24.04" }
        arch:
          - { name: amd64, platform: "linux/amd64" }
          - { name: i386,  platform: "linux/386" }
          - { name: arm64, platform: "linux/arm64" }
          - { name: armhf, platform: "linux/arm/v7" }
        exclude:
          - distro: { name: ubuntu, suite: "22.04", image: "ubuntu:22.04" }
            arch:   { name: i386, platform: "linux/386" }
          - distro: { name: ubuntu, suite: "24.04", image: "ubuntu:24.04" }
            arch:   { name: i386, platform: "linux/386" }
        include:
          - distro: { name: rpios, suite: bookworm, image: "balenalib/rpi-raspbian:bookworm" }
            arch:   { name: armv6, platform: "linux/arm/v6" }

    steps:
      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v5

      - name: Checkout manual release tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - uses: docker/setup-buildx-action@v4

      - name: Build .deb in target container
        env:
          IMAGE: ${{ matrix.distro.image }}
          PLATFORM: ${{ matrix.arch.platform }}
        run: |
          set -euxo pipefail

          docker run --rm -t \
            --platform "${PLATFORM}" \
            -v "$PWD:/src" -w /src \
            "${IMAGE}" bash -lc '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates \
                build-essential \
                devscripts \
                equivs \
                debhelper \
                dpkg-dev \
                fakeroot \
                cmake \
                pkg-config \
                ninja-build \
                libusb-1.0-0-dev

              # Install Build-Depends from debian/control (robust across distros/arches)
              mk-build-deps -i -t "apt-get -y --no-install-recommends" -r debian/control
              rm -f ./*build-deps*.deb || true

              dpkg-buildpackage -us -uc -b

              mkdir -p /src/out
              cp -v ../*.deb ../*.buildinfo ../*.changes /src/out/ || true
            '

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: debs-${{ matrix.distro.name }}-${{ matrix.distro.suite }}-${{ matrix.arch.name }}
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Collect release files (flatten with unique names)
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist_release
          tmp=$(mktemp)
          # Flatten and prefix each file with its artifact directory name to avoid collisions
          find dist -type f \( -name '*.deb' -o -name '*.buildinfo' -o -name '*.changes' \) -print | while read -r f; do
            dir=$(basename "$(dirname "$f")")
            base=$(basename "$f")
            dest="dist_release/${dir}-${base}"
            cp "$f" "$dest"
            echo "$dest"
          done | sort -u > "$tmp"
          if [ ! -s "$tmp" ]; then
            echo "No artifacts found in dist/"; exit 1;
          fi
          {
            echo "files<<EOF"
            cat "$tmp"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create/Update GitHub Release and upload packages
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.collect.outputs.files }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Deploy snapshot documentation to GitHub Pages

on:
  workflow_run:
    workflows:
      - Build main Debian snapshots
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy snapshot documentation
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download architecture-independent snapshot artifact
        uses: actions/download-artifact@v5
        with:
          pattern: debs-main-*-debian-bookworm-all
          path: pages-source
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract documentation package for Pages
        shell: bash
        run: |
          set -euo pipefail

          doc_deb="$(
            find pages-source \
              -type f \
              -name 'libeasymcp2221-doc_*_all.deb' \
              -print \
              -quit
          )"
          test -n "${doc_deb}"
          test "$(dpkg-deb -f "${doc_deb}" Package)" = "libeasymcp2221-doc"
          test "$(dpkg-deb -f "${doc_deb}" Architecture)" = "all"

          rm -rf package-root pages-root
          mkdir -p package-root pages-root
          dpkg-deb -x "${doc_deb}" package-root

          site_dir="package-root/usr/share/doc/libeasymcp2221-doc/html"
          test -f "${site_dir}/index.html"

          cp -a "${site_dir}/." pages-root/

          if find pages-root -type l -print -quit | grep -q .; then
            echo "GitHub Pages artifact must not contain symbolic links" >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-root

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
